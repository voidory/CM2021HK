name: Deploy to GitHub Pages

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --legacy-peer-deps
      - name: Build project
        run: npm run build
      - name: Verify Pages output
        run: |
          test -s dist/index.html
          test -d dist/assets
          test -s dist/chem-revision-app.html
          if grep -q '/src/main.tsx' dist/index.html; then
            echo 'Uncompiled source entry found in Pages output' >&2
            exit 1
          fi
          touch dist/.nojekyll
      - name: Install browser smoke-test tools
        run: |
          npm install --no-save --package-lock=false --legacy-peer-deps playwright
          npx playwright install --with-deps chromium
      - name: Test main and standalone apps under Pages subpath
        run: node scripts/smoke-pages.mjs
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
