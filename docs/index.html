      (function () {
        var rawEntry = document.querySelector('script[type="module"][src="/src/main.tsx"]');
        if (rawEntry && window.location.hostname.endsWith('.github.io')) {
          var directory = new URL('./', window.location.href);
          if (!directory.pathname.endsWith('/docs/')) window.location.replace(new URL('docs/', directory).href);
          return;
        }
        function showFailure() {
          var status = document.getElementById('startup-status');
          if (status) status.textContent = 'CloudChem could not start. Reload this page or open the standalone revision app.';
        }
        window.addEventListener('error', showFailure, true);
        window.addEventListener('unhandledrejection', showFailure);
      }());
