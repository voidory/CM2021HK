    <title>CloudChem - Inorganic Chemistry Adaptive Revision</title>
    <script>
      (function() {
        var path = window.location.pathname;
        var segments = path.split('/').filter(Boolean);
        var basePath = '/';
        if (window.location.hostname.endsWith('github.io') && segments.length > 0) {
          basePath = '/' + segments[0] + '/';
          if (segments[1] === 'docs') basePath += 'docs/';
        }
        window.location.replace(window.location.origin + basePath);
      })();
    </script>
  </head>
